name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: 릴리스 준비
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please가 GITHUB_TOKEN으로 만든 태그와 Release는 push·release 이벤트로 다른
  # 워크플로를 깨우지 못한다. workflow_dispatch는 그 예외라, 발행 워크플로를 직접 띄운다.
  # 재사용 워크플로(workflow_call)로 부르지 않는 이유는 release.yml 머리말에 있다.
  dispatch-publish:
    name: 발행 워크플로 실행
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
