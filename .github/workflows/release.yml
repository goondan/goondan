name: release

# 두 레지스트리에 같은 커밋의 결과물을 올린다. 평소에는 release-please가 GitHub Release를
# 만든 뒤 이 워크플로를 workflow_dispatch로 띄운다. 태그 푸시는 수동 복구 경로다.
#
# 이 워크플로를 다른 워크플로에서 workflow_call로 부르면 안 된다. 신뢰 게시(OIDC)는
# 실행의 최상위 워크플로 파일명을 검사하므로, 재사용 워크플로로 부르면 부른 쪽 파일명이
# 실려 npm과 PyPI 모두 등록된 게시자와 일치하지 않는다.
on:
  push:
    tags: ["v*", "*-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  npm:
    name: npm 단계형 발행
    needs: gate
    runs-on: ubuntu-latest
    # 신뢰 게시(OIDC)는 이 권한으로 단기 신원 증명을 받는다. 보관하는 토큰이 없다.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # 신뢰 게시에는 npm 11.5.1 이상이 필요하다.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # npm은 단계형 발행(staged publish)을 쓴다. 워크플로는 버전을 레지스트리에 올려 두기만
      # 하고, 공개는 관리자가 npmjs.com이나 `npm stage approve`로 승인해야 이루어진다.
      # GitHub 쪽(릴리스 PR 병합, 워크플로)이 뚫려도 npm 계정의 승인 없이는 공개되지 않는다.
      # 공개된 버전이 이미 있으면 건너뛰고, 이미 대기 중인 버전을 다시 올리려 하면 npm이
      # 거부하므로 그 경우도 건너뛴다. 타르볼은 pnpm이 만든다(workspace: 의존을 실제 버전으로
      # 바꿈). 업로드는 npm이 한다(OIDC 교환을 npm CLI가 처리함).
      - name: 단계형 발행
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          for pkg in core models cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
            if [ "$code" = "200" ]; then
              echo "$name@$version 이미 공개됨 — 건너뜀"
              continue
            fi
            if npm stage list "$name" --json 2>/dev/null | grep -q "\"$version\""; then
              echo "$name@$version 이미 승인 대기 중 — 건너뜀"
              continue
            fi
            (cd "packages/$pkg" && pnpm pack --pack-destination /tmp/tarballs >/dev/null)
            tgz=$(ls /tmp/tarballs/goondan-$pkg-$version.tgz)
            if out=$(npm stage publish "$tgz" --access public 2>&1); then
              echo "$out" | tail -5
              echo "$name@$version 승인 대기 상태로 올림"
            elif echo "$out" | grep -qiE "already (exists|staged)|staged version"; then
              echo "$name@$version 이미 승인 대기 중 — 건너뜀"
            else
              echo "$out"; exit 1
            fi
          done
          echo
          echo "승인: npmjs.com의 각 패키지 Staged 탭에서 승인하거나, 관리자 계정으로 'npm stage list <패키지>'로 id를 확인한 뒤 'npm stage approve <id>'"

  pypi:
    name: PyPI 발행
    needs: gate
    runs-on: ubuntu-latest
    # PyPI의 신뢰 게시자 등록이 이 환경 이름을 확인한다.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
        working-directory: python/goondan
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/goondan/dist
          skip-existing: true
