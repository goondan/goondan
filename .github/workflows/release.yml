name: release

# 두 레지스트리에 같은 커밋의 결과물을 올린다. 평소에는 release-please가 GitHub Release를
# 만든 뒤 이 워크플로를 workflow_dispatch로 띄운다. 태그 푸시는 수동 복구 경로다.
#
# 이 워크플로를 다른 워크플로에서 workflow_call로 부르면 안 된다. 신뢰 게시(OIDC)는
# 실행의 최상위 워크플로 파일명을 검사하므로, 재사용 워크플로로 부르면 부른 쪽 파일명이
# 실려 npm과 PyPI 모두 등록된 게시자와 일치하지 않는다.
on:
  push:
    tags: ["v*", "*-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  npm:
    name: npm 발행
    needs: gate
    runs-on: ubuntu-latest
    # 신뢰 게시(OIDC)는 이 권한으로 단기 신원 증명을 받는다. 보관하는 토큰이 없다.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # 신뢰 게시에는 npm 11.5.1 이상이 필요하다.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # core가 먼저 올라가야 models와 cli의 의존이 레지스트리에 존재한다.
      # 이미 같은 버전이 있으면 건너뛰므로 발행을 다시 시도해도 실패하지 않는다.
      # 있는지는 버전 문서를 직접 조회해 판단한다. 새 버전이 패키지 목록에 반영되기까지
      # 몇 분이 걸릴 수 있어서, 목록을 읽는 `npm view`로는 방금 올린 버전을 놓친다.
      # 타르볼은 pnpm이 만든다(workspace: 의존을 실제 버전으로 바꿈). 업로드는 npm이 한다
      # (OIDC 교환을 npm CLI가 처리함). npmjs.com의 신뢰 게시자 설정에서 세 패키지 모두
      # 직접 `npm publish`를 허용해 두었다.
      - name: 발행
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          for pkg in core models cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
            if [ "$code" = "200" ]; then
              echo "$name@$version 이미 발행됨 — 건너뜀"
              continue
            fi
            (cd "packages/$pkg" && pnpm pack --pack-destination /tmp/tarballs >/dev/null)
            tgz=$(ls /tmp/tarballs/goondan-$pkg-$version.tgz)
            npm publish "$tgz" --access public
          done

  pypi:
    name: PyPI 발행
    needs: gate
    runs-on: ubuntu-latest
    # PyPI의 신뢰 게시자 등록이 이 환경 이름을 확인한다.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
        working-directory: python/goondan
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/goondan/dist
          skip-existing: true
