name: release

# 태그를 밀면 두 레지스트리에 같은 커밋의 결과물이 올라간다. 수동 실행은 태그를 다시
# 만들지 않고 발행만 다시 시도할 때 쓴다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  npm:
    name: npm 발행
    needs: gate
    runs-on: ubuntu-latest
    # 신뢰 게시(OIDC)는 이 권한으로 단기 신원 증명을 받는다. 보관하는 토큰이 없다.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # 신뢰 게시에는 npm 11.5.1 이상이 필요하다.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # core가 먼저 올라가야 models와 cli의 의존이 레지스트리에 존재한다.
      # 이미 같은 버전이 있으면 건너뛴다. 발행을 다시 시도해도 실패하지 않는다.
      - name: 발행
        run: |
          set -euo pipefail
          for pkg in core models cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version 이미 발행됨 — 건너뜀"
              continue
            fi
            (cd "packages/$pkg" && pnpm publish --access public --no-git-checks)
          done

  pypi:
    name: PyPI 발행
    needs: gate
    runs-on: ubuntu-latest
    # PyPI의 신뢰 게시자 등록이 이 환경 이름을 확인한다.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
        working-directory: python/goondan
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/goondan/dist
          skip-existing: true
