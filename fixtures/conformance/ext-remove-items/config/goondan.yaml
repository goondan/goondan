agents:
  base:
    model: m
    tools:
      - search
      - tool: publish
        approval: required
      - agent: helper
    extensions:
      audit: {}
      memory: {}
    hooks:
      onModelInput:
        - name: trim
          fn: trimContext
        - fn: other
      onOutput:
        - extension: audit
  helper:
    model: m
  reader:
    inherit: base
    remove:
      tools: [publish, helper, ghost]
      extensions: [audit]
      hooks:
        onModelInput: [trim]
