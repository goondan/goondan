agents:
  main:
    model: m
    tools: [lookup]
    hooks:
      onInput:
        - fn: hInput
      onStep:
        - fn: hConversation
      onModelInput:
        - fn: hModelInput
      onModelResult:
        - fn: hModelResult
      onToolCall:
        - fn: hToolCall
      onToolResult:
        - fn: hToolResult
      onOutput:
        - fn: hOutput
      onError:
        - fn: hError
