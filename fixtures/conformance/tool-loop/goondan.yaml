version: 1
name: conformance-tool-loop
agents:
  main:
    model: fixture
    input: asis
    tools:
      - lookup
      - finish
    extensions: {completion: {}}
    hooks:
      toolCall: [{name: addExecution, fn: addExecution}]
      toolResult: [{name: markResult, fn: markResult}, {extension: completion}]
flow: {in: main}
