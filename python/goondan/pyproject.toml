[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goondan"
version = "0.1.0"
description = "Native Python runtime for portable Goondan configurations"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
